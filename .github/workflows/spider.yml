name: generate spider contribution graph

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # a red "spider" crawls the graph and eats contributions, drawn in suit blues
      - name: generate spider-contribution-graph.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/spider-contribution-graph.svg?color_snake=#E23636&color_dots=#ebedf0,#c7d7fb,#8fb0f5,#4f7fe6,#1f3fa8
            dist/spider-contribution-graph-dark.svg?color_snake=#E23636&color_dots=#161b22,#13235a,#1f3fa8,#2b59d8,#5b8def

      - name: push svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
